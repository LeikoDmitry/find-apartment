services:
  finder:
    build: .
    image: ghcr.io/leikodmitry/find-apartment:1.0.1
    environment:
      - TZ=Europe/Minsk
    volumes:
      - .:/app
    command: sh -c "while true; do python find_apartments.py; sleep 600; done"
    restart: unless-stopped

  watcher:
    build: .
    image: ghcr.io/leikodmitry/find-apartment:1.0.1
    environment:
      - TZ=Europe/Minsk
    volumes:
      - .:/app
    command: python telegram_command_watcher.py
    restart: unless-stopped

  checks:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: find-apartment-dev:latest
    profiles: ["checks"]
    volumes:
      - .:/app
